name: Build Linux & iOS

# Builds the AppImage (Linux) and the unsigned IPA (iOS), and attaches them to the release.
# - Automatic: when app code changes on main, or on every published release
# - Manual: Actions tab -> "Run workflow"
on:
  push:
    branches: [main]
    paths:
      - "linux/**"
      - "ios/**"
      - ".github/workflows/build.yml"
      - "android/assets/index.html"
      - "android/assets/fonts/**"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the binaries to"
        required: true
        default: "v1.0.0"
  release:
    types: [published]

permissions:
  contents: write

jobs:
  linux:
    name: Linux AppImage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build AppImage
        working-directory: linux
        run: |
          npm install
          npm run dist

      - name: Collect artifact
        run: |
          mkdir -p out
          cp linux/dist/*.AppImage out/

      - uses: actions/upload-artifact@v4
        with:
          name: GamingDaily-Linux-AppImage
          path: out/*.AppImage

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name || github.event.inputs.tag || 'v1.0.0' }}
        run: gh release upload "$TAG" out/*.AppImage --clobber --repo "${{ github.repository }}"

  ios:
    name: iOS IPA (unsigned)
    # macOS 15 ships Xcode 16, compatible with the project format generated by XcodeGen.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Bundle web UI
        run: |
          cp android/assets/index.html ios/GamingDaily/index.html
          mkdir -p ios/GamingDaily/fonts && cp -r android/assets/fonts/. ios/GamingDaily/fonts/

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build (unsigned)
        working-directory: ios
        run: |
          xcodebuild \
            -project GamingDaily.xcodeproj \
            -scheme GamingDaily \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package .ipa
        working-directory: ios
        run: |
          APP="build/Build/Products/Release-iphoneos/GamingDaily.app"
          if [ ! -d "$APP" ]; then echo "Build not found"; ls -R build/Build/Products || true; exit 1; fi
          mkdir -p Payload
          cp -R "$APP" Payload/GamingDaily.app
          zip -qr GamingDaily-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: GamingDaily-iOS-IPA-unsigned
          path: ios/GamingDaily-unsigned.ipa

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name || github.event.inputs.tag || 'v1.0.0' }}
        run: gh release upload "$TAG" ios/GamingDaily-unsigned.ipa --clobber --repo "${{ github.repository }}"
